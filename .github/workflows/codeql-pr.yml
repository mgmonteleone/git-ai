# Fork-safe PR-only companion to codeql.yml.
#
# codeql.yml carries a `schedule:` trigger, which GitHub Actions disables
# entirely (all triggers, not just `schedule`) on repositories created as a
# fork — see `state: disabled_fork` on that workflow. Re-enabling it here
# would also arm its schedule and its push-to-main trigger, which is out of
# scope for closing the PR-check gap and has not been separately reviewed.
#
# This file mirrors only the `analyze` job's `pull_request` behavior from
# codeql.yml (same matrix, permissions, and pinned actions) so CodeQL runs on
# PRs against this fork without touching the inherited, schedule-bearing
# workflow. Remove this file if/when codeql.yml itself is safely enabled.
name: "CodeQL Advanced (PR)"

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
        - language: rust
          build-mode: none
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config: |
          query-filters:
            - exclude:
                id: rust/path-injection

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
      with:
        category: "/language:${{matrix.language}}"
