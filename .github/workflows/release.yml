name: Candidate binaries (CSS-2302)

# Isolated, workflow_dispatch-only build used to produce native candidate
# binaries for review of a specific pinned commit (CSS-2302). This file
# intentionally overrides the production release.yml ONLY on this helper
# branch (mgmonteleone/css-2302-prerelease-helper-39e16c21); main and the
# source PR branch are never touched by this workflow.
#
# This workflow BUILDS ONLY: no signing, notarization, packaging (MSI/PKG),
# install scripts, version bumps, release-channel calls, or GitHub Releases.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Informational only. The build always pins to the approved commit below, regardless of this value.'
        required: false
        default: 'mgmonteleone/css-2302-windows-daemon-fix'
        type: string
      expected_source_sha:
        description: 'Cross-checked against the literal approved constant; the literal constant always wins.'
        required: false
        default: '8d7fd65464f1f99bea4368d6e588d0a5bcd93a05'
        type: string
      expected_source_tree:
        description: 'Cross-checked against the literal approved constant; the literal constant always wins.'
        required: false
        default: '5addd36208ba24be5bbd37635d105809aff49141'
        type: string
      expected_helper_sha:
        description: 'Optional: expected commit SHA of this helper-branch workflow file (github.sha). Validated separately from source SHA/tree.'
        required: false
        default: ''
        type: string
      windows_pipe_probe:
        description: 'CSS-2302 diagnostic (opt-in): run ONLY the bounded single Windows install-pipeline probe job instead of the candidate build matrix. Never combine with a normal candidate-build dispatch.'
        required: false
        default: false
        type: boolean
      windows_regression_validation:
        description: 'CSS-2302 validation (opt-in): run ONLY the bounded single Windows job that compiles the daemon_mode test target and executes exactly the daemon_windows_bg_start_wrapper_stdout_closes_promptly_while_daemon_stays_up regression against the pinned validation candidate commit below. Never combine with a normal candidate-build dispatch or with windows_pipe_probe.'
        required: false
        default: false
        type: boolean

env:
  APPROVED_SOURCE_SHA: 8d7fd65464f1f99bea4368d6e588d0a5bcd93a05
  APPROVED_SOURCE_TREE: 5addd36208ba24be5bbd37635d105809aff49141
  VALIDATION_CANDIDATE_SHA: 43341ba4f2443c424d89aa2aaab166063b0659f3
  VALIDATION_CANDIDATE_TREE: 5addd36208ba24be5bbd37635d105809aff49141

jobs:
  build:
    name: Build candidate for ${{ matrix.target }}
    if: ${{ inputs.windows_pipe_probe != true && inputs.windows_regression_validation != true }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: git-ai-linux-x64.tar.gz
            os_family: linux
            use_docker: true
            docker_image: ubuntu:22.04@sha256:4f838adc7181d9039ac795a7d0aba05a9bd9ecd480d294483169c5def983b64d
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            asset: git-ai-linux-arm64.tar.gz
            os_family: linux
            use_docker: true
            docker_image: ubuntu:22.04@sha256:4f838adc7181d9039ac795a7d0aba05a9bd9ecd480d294483169c5def983b64d
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: git-ai-macos-arm64.tar.gz
            os_family: macos
            use_docker: false
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: git-ai-macos-x64.tar.gz
            os_family: macos
            use_docker: false

    steps:
      - name: Checkout candidate source (pinned to approved commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8d7fd65464f1f99bea4368d6e588d0a5bcd93a05
          persist-credentials: false

      - name: Verify checked-out commit and tree against approved constants
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          ACTUAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          echo "Actual HEAD:           $ACTUAL_SHA"
          echo "Approved source SHA:   $APPROVED_SOURCE_SHA"
          echo "Actual tree:           $ACTUAL_TREE"
          echo "Approved source tree:  $APPROVED_SOURCE_TREE"

          if [[ "$ACTUAL_SHA" != "$APPROVED_SOURCE_SHA" ]]; then
            echo "::error::Checked-out HEAD ($ACTUAL_SHA) does not match the approved source SHA ($APPROVED_SOURCE_SHA)"
            exit 1
          fi
          if [[ "$ACTUAL_TREE" != "$APPROVED_SOURCE_TREE" ]]; then
            echo "::error::Checked-out tree ($ACTUAL_TREE) does not match the approved source tree ($APPROVED_SOURCE_TREE)"
            exit 1
          fi

          # Inputs are informational; if supplied they must agree with the
          # literal approved constants above. The literal constants are what
          # actually gate the build either way.
          if [[ -n "${{ inputs.expected_source_sha }}" && "${{ inputs.expected_source_sha }}" != "$APPROVED_SOURCE_SHA" ]]; then
            echo "::error::Supplied expected_source_sha input disagrees with the literal approved constant"
            exit 1
          fi
          if [[ -n "${{ inputs.expected_source_tree }}" && "${{ inputs.expected_source_tree }}" != "$APPROVED_SOURCE_TREE" ]]; then
            echo "::error::Supplied expected_source_tree input disagrees with the literal approved constant"
            exit 1
          fi

      - name: Record helper workflow provenance (separate from source verification)
        shell: bash
        run: |
          set -euo pipefail
          echo "Helper event ref (workflow_dispatch ref): ${{ github.ref }}"
          echo "Helper commit (github.sha; the workflow-file commit, NOT the pinned source commit): ${{ github.sha }}"
          if [[ -n "${{ inputs.expected_helper_sha }}" && "${{ inputs.expected_helper_sha }}" != "${{ github.sha }}" ]]; then
            echo "::error::Supplied expected_helper_sha does not match github.sha for this run"
            exit 1
          fi
          echo "Note: github.sha is intentionally never compared against the pinned source SHA."

      - name: Build in Docker (Linux musl)
        if: matrix.use_docker == true
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            -e OSS_BUILD="1" \
            -e CARGO_INCREMENTAL="0" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            ${{ matrix.docker_image }} \
            bash -c "
              set -euo pipefail
              apt-get update && \
              apt-get install -y curl build-essential pkg-config musl-tools && \
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.0 --target ${{ matrix.target }} && \
              . \$HOME/.cargo/env && \
              cargo build --release --locked --target ${{ matrix.target }} && \
              strip target/${{ matrix.target }}/release/git-ai && \
              chown -R \"\$HOST_UID:\$HOST_GID\" target
            "

      - name: Install Rust toolchain (macOS)
        if: matrix.use_docker == false
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.93.0"
          targets: ${{ matrix.target }}

      - name: Build release binary (macOS)
        if: matrix.use_docker == false
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_INCREMENTAL: 0
          OSS_BUILD: "1"

      - name: Strip binary (macOS)
        if: matrix.use_docker == false
        run: strip target/${{ matrix.target }}/release/git-ai

      - name: Verify architecture and linkage (Linux)
        if: matrix.os_family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/git-ai
          file "$BIN"
          LDD_OUTPUT="$(ldd "$BIN" 2>&1)" || true
          echo "$LDD_OUTPUT"
          if echo "$LDD_OUTPUT" | grep -qi 'not a dynamic executable\|statically linked'; then
            echo "Observed: binary is statically linked (musl); no GLIBC dependency"
          else
            echo "::error::Binary does not appear statically linked; see ldd output above"
            exit 1
          fi

      - name: Verify architecture and linkage (macOS)
        if: matrix.os_family == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/git-ai
          file "$BIN"
          lipo -info "$BIN"
          otool -L "$BIN" || true

      - name: Smoke test --version
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/git-ai
          chmod 0755 "$BIN"
          VERSION_OUTPUT="$("$BIN" --version)"
          echo "Version output: $VERSION_OUTPUT"
          echo "VERSION_OUTPUT=$VERSION_OUTPUT" >> "$GITHUB_ENV"

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/git-ai
          mkdir -p dist
          cp "$BIN" dist/git-ai
          chmod 0755 dist/git-ai
          tar -czf ${{ matrix.asset }} -C dist git-ai
          sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          cat ${{ matrix.asset }}.sha256

      - name: Generate per-target manifest fragment
        shell: bash
        run: |
          set -euo pipefail
          SHA256_ONLY="$(cut -d' ' -f1 ${{ matrix.asset }}.sha256)"
          cat > manifest-${{ matrix.target }}.json <<EOF
          {
            "target": "${{ matrix.target }}",
            "runner": "${{ matrix.runner }}",
            "asset": "${{ matrix.asset }}",
            "source_sha": "${APPROVED_SOURCE_SHA}",
            "source_tree": "${APPROVED_SOURCE_TREE}",
            "helper_commit_sha": "${{ github.sha }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "rust_version": "1.93.0",
            "build_command": "cargo build --release --locked --target ${{ matrix.target }}",
            "build_profile": "release",
            "features": "default",
            "version_output": "${VERSION_OUTPUT}",
            "sha256": "${SHA256_ONLY}",
            "signed": false,
            "notarized": false,
            "signing_note": "unsigned/un-notarized candidate build for review only; not for distribution"
          }
          EOF
          cat manifest-${{ matrix.target }}.json

      - name: Upload target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.target }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
            manifest-${{ matrix.target }}.json
          retention-days: 14

  aggregate:
    name: Aggregate candidate manifests
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-*
          path: artifacts
          merge-multiple: true

      - name: Build combined SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          cat -- *.sha256 | sort > SHA256SUMS
          rm -f -- *.sha256
          cat SHA256SUMS

      - name: Build combined manifest.json
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          jq -s '{
            source_sha: .[0].source_sha,
            source_tree: .[0].source_tree,
            helper_commit_sha: .[0].helper_commit_sha,
            workflow_run_id: .[0].workflow_run_id,
            workflow_run_url: .[0].workflow_run_url,
            targets: .
          }' manifest-*.json > manifest.json
          rm -f -- manifest-*.json
          cat manifest.json

      - name: Upload combined artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-manifest
          path: |
            artifacts/SHA256SUMS
            artifacts/manifest.json
          retention-days: 14

  windows_pipe_probe:
    # CSS-2302 bounded diagnostic (opt-in via workflow_dispatch inputs.windows_pipe_probe).
    # Single Windows job only: no matrix, no candidate build/aggregate jobs, no
    # publishing. Builds the PINNED PR head source (NOT the candidate SHA above,
    # which is a stale/unrelated pin) and tests whether install.ps1's real
    # `install-hooks --env | Out-Host` pipeline is released once this run's own
    # spawned daemon (and only that daemon) is stopped. Read-only observation via
    # standard PowerShell/.NET; no Sysinternals/handle-table tools, no test DB
    # vars/feature flags to suppress the real daemon auto-spawn.
    name: "CSS-2302 Windows install-pipeline probe (diagnostic, opt-in)"
    if: ${{ inputs.windows_pipe_probe == true }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PROBE_SOURCE_SHA: 1e175589ec1a554cf7270b1f9ca9a91e55aeab94
      PROBE_SOURCE_TREE: a5ee1708f94d6a6b028fd4e191667b58042829c9
    steps:
      - name: Checkout probe source (pinned to approved diagnostic commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1e175589ec1a554cf7270b1f9ca9a91e55aeab94
          persist-credentials: false

      - name: Verify checked-out commit and tree against approved diagnostic constants
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          ACTUAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          echo "Actual HEAD:                $ACTUAL_SHA"
          echo "Approved probe source SHA:  $PROBE_SOURCE_SHA"
          echo "Actual tree:                $ACTUAL_TREE"
          echo "Approved probe source tree: $PROBE_SOURCE_TREE"

          if [[ "$ACTUAL_SHA" != "$PROBE_SOURCE_SHA" ]]; then
            echo "::error::Checked-out HEAD ($ACTUAL_SHA) does not match the approved probe source SHA ($PROBE_SOURCE_SHA)"
            exit 1
          fi
          if [[ "$ACTUAL_TREE" != "$PROBE_SOURCE_TREE" ]]; then
            echo "::error::Checked-out tree ($ACTUAL_TREE) does not match the approved probe source tree ($PROBE_SOURCE_TREE)"
            exit 1
          fi

      - name: Install Rust toolchain (Windows probe)
        # Matches the toolchain already used by the real hanging E2E job
        # (install-scripts-local-pr.yml's install-local-windows job uses
        # `toolchain: stable`), not the release matrix's pinned 1.93.0 above,
        # which is for an unrelated Linux/macOS candidate build.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Build release binary (probe)
        id: build
        timeout-minutes: 10
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          OSS_BUILD: "1"
        run: |
          set -euo pipefail
          rustc --version | tee /tmp/rustc_version.txt
          cargo --version | tee /tmp/cargo_version.txt
          cargo build --release --locked --bin git-ai
          echo "PROBE_RUSTC_VERSION=$(cat /tmp/rustc_version.txt)" >> "$GITHUB_ENV"
          echo "PROBE_CARGO_VERSION=$(cat /tmp/cargo_version.txt)" >> "$GITHUB_ENV"

      - name: Record built binary provenance
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE 'target\release\git-ai.exe'
          if (-not (Test-Path -LiteralPath $bin)) { throw "built binary missing: $bin" }
          $resolvedBin = (Resolve-Path -LiteralPath $bin).Path
          $hash = (Get-FileHash -LiteralPath $resolvedBin -Algorithm SHA256).Hash
          Add-Content -Path $env:GITHUB_ENV -Value "BIN_PATH=$resolvedBin"
          Add-Content -Path $env:GITHUB_ENV -Value "BIN_SHA256=$hash"
          Write-Host "Built binary: $resolvedBin"
          Write-Host "SHA256: $hash"
          & $resolvedBin --version
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
          Write-Host "Runner image: $env:ImageOS $env:ImageVersion"

      - name: Run install pipeline probe (Windows, isolated HOME)
        id: probe
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:BUILD_OUTCOME -ne 'success') {
            $result = [ordered]@{
              conclusion    = 'inconclusive_build_did_not_succeed'
              build_outcome = $env:BUILD_OUTCOME
            }
            $result | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'probe-result.json')
            Write-Host ($result | ConvertTo-Json)
            exit 0
          }

          # --- Duplicated from install.ps1 (Normalize-PathString / Get-GitAiManagedProcesses). ---
          # install.ps1 is a standalone bootstrap script, not an importable module
          # (dot-sourcing it would execute the real installer at file scope), so
          # its exact, already-reviewed ownership-detection helpers are
          # reproduced verbatim here rather than re-derived, per repo convention
          # to reuse existing tested logic instead of inventing new heuristics.
          function Normalize-PathString {
              param([Parameter(Mandatory = $true)][string]$Path)
              try {
                  return ([IO.Path]::GetFullPath($Path.Trim())).TrimEnd('\').ToLowerInvariant()
              } catch {
                  return ($Path.Trim()).TrimEnd('\').ToLowerInvariant()
              }
          }

          function Get-GitAiManagedProcesses {
              param([Parameter(Mandatory = $true)][string]$InstallDir)
              $targetPaths = @(
                  (Normalize-PathString (Join-Path $InstallDir 'git-ai.exe')),
                  (Normalize-PathString (Join-Path $InstallDir 'git.exe'))
              )
              return @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
                  $_.ProcessId -ne $PID -and
                  $_.ExecutablePath -and
                  ($targetPaths -contains (Normalize-PathString $_.ExecutablePath))
              })
          }
          # --- end duplicated helpers ---

          $testHome = Join-Path $env:RUNNER_TEMP 'git-ai-probe-home'
          New-Item -ItemType Directory -Force -Path $testHome | Out-Null
          $homeDrive = [System.IO.Path]::GetPathRoot($testHome).TrimEnd('\')
          $homePath = $testHome.Substring($homeDrive.Length)
          $installDir = Join-Path $testHome '.git-ai\bin'

          $repoRoot = $env:GITHUB_WORKSPACE
          $markerPath = Join-Path $testHome 'probe-install-complete.marker'
          $wrapperScript = Join-Path $testHome 'run-install.ps1'

          # Wrapper runs the REAL, unmodified install.ps1 (same script the E2E
          # job uses) in its OWN pwsh.exe child process, so the exact production
          # `install-hooks --env | Out-Host` pipe is exercised there while this
          # controlling script bound-waits / inspects / kills from outside
          # without disturbing it. A completion marker is written immediately
          # after install.ps1 returns, distinguishing "script logic completed"
          # from "outer process merely still alive".
          # Built as a joined line array (not a here-string) because a
          # here-string's closing `"@` must sit at column 0, which would
          # break this YAML block scalar's required indentation.
          $wrapperLines = @(
              "`$ErrorActionPreference = 'Stop'",
              "Set-Location '$repoRoot'",
              "Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force",
              "& '$repoRoot\install.ps1'",
              "`$exitCode = `$LASTEXITCODE",
              "([ordered]@{",
              "  completed_utc = (Get-Date).ToUniversalTime().ToString('o')",
              "  install_ps1_last_exit_code = `$exitCode",
              "} | ConvertTo-Json) | Set-Content -LiteralPath '$markerPath'"
          )
          ($wrapperLines -join "`n") | Set-Content -LiteralPath $wrapperScript -Encoding utf8

          $env:HOME = $testHome
          $env:USERPROFILE = $testHome
          $env:HOMEDRIVE = $homeDrive
          $env:HOMEPATH = $homePath
          $env:GIT_AI_LOCAL_BINARY = $env:BIN_PATH

          $probeStart = Get-Date
          $pwshExe = (Get-Command pwsh).Source
          $wrapperProc = Start-Process -FilePath $pwshExe -ArgumentList @('-NoLogo', '-NoProfile', '-File', $wrapperScript) -PassThru

          $hangWaitSeconds = 240
          $deadline = $probeStart.AddSeconds($hangWaitSeconds)
          while ((Get-Date) -lt $deadline -and -not (Test-Path -LiteralPath $markerPath) -and -not $wrapperProc.HasExited) {
              Start-Sleep -Seconds 5
          }

          $markerFoundBeforeKill = Test-Path -LiteralPath $markerPath
          $wrapperExitedBeforeKill = $wrapperProc.HasExited

          $result = [ordered]@{
              probe_start_utc            = $probeStart.ToUniversalTime().ToString('o')
              hang_wait_seconds          = $hangWaitSeconds
              marker_found_before_kill   = $markerFoundBeforeKill
              wrapper_exited_before_kill = $wrapperExitedBeforeKill
              daemon_candidate_count     = 0
              daemon_killed              = $false
              daemon_kill_verified_exit  = $false
              marker_found_after_kill    = $false
              wrapper_exited_after_kill  = $false
              conclusion                 = 'inconclusive'
              rustc_version              = $env:PROBE_RUSTC_VERSION
              cargo_version              = $env:PROBE_CARGO_VERSION
              pwsh_version               = $PSVersionTable.PSVersion.ToString()
              built_binary_sha256        = $env:BIN_SHA256
              source_sha                 = $env:PROBE_SOURCE_SHA
              source_tree                = $env:PROBE_SOURCE_TREE
          }

          if (-not $markerFoundBeforeKill -and -not $wrapperExitedBeforeKill) {
              # Stalled. Identify our own just-spawned daemon: exact resolved
              # path under this job's OWN isolated install dir (unambiguous,
              # since $testHome is unique to this run), further narrowed to
              # processes created after this probe started.
              $candidates = @(Get-GitAiManagedProcesses -InstallDir $installDir | Where-Object { $_.CreationDate -gt $probeStart })
              $result.daemon_candidate_count = $candidates.Count

              if ($candidates.Count -eq 1) {
                  $daemonPid = [int]$candidates[0].ProcessId
                  try {
                      $daemonProc = [System.Diagnostics.Process]::GetProcessById($daemonPid)
                      $daemonProc.Kill($true)
                      $result.daemon_killed = $true
                      $result.daemon_kill_verified_exit = [bool]$daemonProc.WaitForExit(30000)
                  } catch {
                      $result.daemon_killed = $false
                  }

                  $postKillDeadline = (Get-Date).AddSeconds(45)
                  while ((Get-Date) -lt $postKillDeadline -and -not (Test-Path -LiteralPath $markerPath) -and -not $wrapperProc.HasExited) {
                      Start-Sleep -Seconds 3
                  }
                  $result.marker_found_after_kill   = Test-Path -LiteralPath $markerPath
                  $result.wrapper_exited_after_kill = $wrapperProc.HasExited

                  if ($result.marker_found_after_kill -or $result.wrapper_exited_after_kill) {
                      $result.conclusion = 'daemon_lifetime_release_observed'
                  } else {
                      $result.conclusion = 'still_stalled_after_daemon_kill'
                  }
              } else {
                  # Zero or multiple candidates: ownership is not unambiguous.
                  # Do NOT kill anything; report inconclusive instead.
                  $result.conclusion = 'inconclusive_ambiguous_daemon_ownership'
              }
          } else {
              $result.conclusion = 'no_hang_observed'
          }

          Add-Content -Path $env:GITHUB_ENV -Value "WRAPPER_PID=$($wrapperProc.Id)"

          $result | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $repoRoot 'probe-result.json')
          $result | ConvertTo-Json -Depth 5 | Write-Host

      - name: Stop probe daemon and wrapper (best-effort cleanup)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $testHome = Join-Path $env:RUNNER_TEMP 'git-ai-probe-home'
          $installDir = Join-Path $testHome '.git-ai\bin'
          $gitAiExe = Join-Path $installDir 'git-ai.exe'

          # Same graceful-shutdown pattern already used by the existing E2E
          # Windows job (install-scripts-local-pr.yml "Stop installed daemon
          # (Windows)" step), scoped to this job's own isolated install dir.
          if (Test-Path -LiteralPath $gitAiExe) {
              $env:HOME = $testHome
              $env:USERPROFILE = $testHome
              & $gitAiExe bg shutdown --hard 2>&1 | Out-Null
              $global:LASTEXITCODE = 0
          }

          # Kill the wrapper pwsh.exe child process by the exact PID this job
          # itself captured from Start-Process, if it is still running.
          if ($env:WRAPPER_PID) {
              try {
                  $wrapperProc = Get-Process -Id ([int]$env:WRAPPER_PID) -ErrorAction SilentlyContinue
                  if ($wrapperProc -and -not $wrapperProc.HasExited) {
                      $wrapperProc.Kill($true)
                  }
              } catch {}
          }

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-pipe-probe-result
          path: probe-result.json
          retention-days: 14
          if-no-files-found: warn

  windows_regression_validation:
    # CSS-2302 bounded validation (opt-in via workflow_dispatch
    # inputs.windows_regression_validation). Single Windows job only: no
    # matrix, no candidate build/aggregate jobs, no publishing. Checks out the
    # immutable pinned validation candidate commit (NOT this helper branch's
    # head and NOT the source branch head) and executes exactly one named
    # regression test to confirm it compiles and passes on native Windows.
    name: "CSS-2302 Windows regression validation (single test, opt-in)"
    if: ${{ inputs.windows_regression_validation == true }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout validation candidate (pinned to approved candidate commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 43341ba4f2443c424d89aa2aaab166063b0659f3
          persist-credentials: false

      - name: Verify checked-out commit and tree against approved candidate constants
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          ACTUAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          echo "Actual HEAD:                   $ACTUAL_SHA"
          echo "Approved validation candidate: $VALIDATION_CANDIDATE_SHA"
          echo "Actual tree:                   $ACTUAL_TREE"
          echo "Approved candidate tree:       $VALIDATION_CANDIDATE_TREE"

          if [[ "$ACTUAL_SHA" != "$VALIDATION_CANDIDATE_SHA" ]]; then
            echo "::error::Checked-out HEAD ($ACTUAL_SHA) does not match the approved validation candidate SHA ($VALIDATION_CANDIDATE_SHA)"
            exit 1
          fi
          if [[ "$ACTUAL_TREE" != "$VALIDATION_CANDIDATE_TREE" ]]; then
            echo "::error::Checked-out tree ($ACTUAL_TREE) does not match the approved validation candidate tree ($VALIDATION_CANDIDATE_TREE)"
            exit 1
          fi

      - name: Install Rust toolchain (Windows validation)
        # Matches the toolchain already used by windows_pipe_probe above
        # (`toolchain: stable`), not the release matrix's pinned 1.93.0,
        # which is for an unrelated Linux/macOS candidate build.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2

      - name: Record toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          task --version

      - name: Compile daemon_mode target and assert exactly one filtered test is selected
        id: list
        timeout-minutes: 14
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          TEST_NAME="daemon_windows_bg_start_wrapper_stdout_closes_promptly_while_daemon_stays_up"
          task test \
            CARGO_TEST_ARGS="--test daemon_mode" \
            TEST_FILTER="$TEST_NAME" \
            EXTRA_TEST_BINARY_ARGS="--exact --list" \
            | tee list-output.txt
          MATCH_COUNT="$(grep -c -- "^${TEST_NAME}: test$" list-output.txt || true)"
          echo "Matched test count: $MATCH_COUNT"
          if [[ "$MATCH_COUNT" != "1" ]]; then
            echo "::error::Expected exactly 1 selected test named $TEST_NAME, got $MATCH_COUNT"
            exit 1
          fi

      - name: Execute the single named regression
        id: run_test
        timeout-minutes: 4
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          TEST_NAME="daemon_windows_bg_start_wrapper_stdout_closes_promptly_while_daemon_stays_up"
          set +e
          task test \
            CARGO_TEST_ARGS="--test daemon_mode" \
            TEST_FILTER="$TEST_NAME" \
            EXTRA_TEST_BINARY_ARGS="--exact" \
            | tee run-output.txt
          TASK_EXIT="${PIPESTATUS[0]}"
          set -e
          echo "task test exit code: $TASK_EXIT"

          RESULT_LINE="$(grep -E "^test result: " run-output.txt || true)"
          echo "Result line: $RESULT_LINE"
          if [[ ! "$RESULT_LINE" =~ ^test\ result:\ ok\.\ 1\ passed\;\ 0\ failed\;\ 0\ ignored\; ]]; then
            echo "::error::Expected exactly 'test result: ok. 1 passed; 0 failed; 0 ignored; ...', got: $RESULT_LINE"
            exit 1
          fi
          if [[ "$TASK_EXIT" != "0" ]]; then
            echo "::error::task test exited $TASK_EXIT despite a matching result line"
            exit 1
          fi
          echo "native_result=pass" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### CSS-2302 Windows regression validation"
            echo "- Candidate SHA: $VALIDATION_CANDIDATE_SHA"
            echo "- Candidate tree: $VALIDATION_CANDIDATE_TREE"
            echo "- List step outcome: ${{ steps.list.outcome }}"
            echo "- Run step outcome: ${{ steps.run_test.outcome }}"
            echo "- Native result: ${{ steps.run_test.outputs.native_result || 'not-pass' }}"
          } >> "$GITHUB_STEP_SUMMARY"
